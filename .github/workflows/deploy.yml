name: Build and Deploy .NET App

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore "Inlämning 2 (L.Apple)/LApple/LApple.csproj"

      - name: Build
        run: dotnet build "Inlämning 2 (L.Apple)/LApple/LApple.csproj" --configuration Release --no-restore

      - name: Publish
        run: dotnet publish "Inlämning 2 (L.Apple)/LApple/LApple.csproj" --configuration Release --output ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: webapp-artifact
          path: ./publish

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v3
        with:
          name: webapp-artifact
          path: ./publish

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.BASTION_IP }} >> ~/.ssh/known_hosts

      - name: Copy files via Bastion to App Server
        run: |
          scp -i ~/.ssh/id_rsa -r ./publish/* \
            azureuser@${{ secrets.BASTION_IP }}:/tmp/webapp/
          ssh -i ~/.ssh/id_rsa azureuser@${{ secrets.BASTION_IP }} \
            "scp -r /tmp/webapp/* \
            azureuser@${{ secrets.APPSERVER_IP }}:/var/www/webapp/"

      - name: Restart SystemD service
        run: |
          ssh -i ~/.ssh/id_rsa azureuser@${{ secrets.BASTION_IP }} \
            "ssh azureuser@${{ secrets.APPSERVER_IP }} \
            'sudo systemctl restart webapp'"
